### model
model_name_or_path: Qwen2.5-3B-Instruct

trust_remote_code: true
  
### method
stage: sft
do_train: true 
finetuning_type: lora
lora_rank: 8
### all layer lora
# lora_target: embed_tokens,lm_head,q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
## Specific layer lora
# lora_target: embed_tokens,lm_head
lora_target: all
# lora_target: None

# use_dora: true

deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: CHEBI20_train

template: llama3
# cutoff_len: 5120
cutoff_len: 2048
max_samples: 10000000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4 

### output
output_dir: saves/
logging_steps: 10
save_steps: 30000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

